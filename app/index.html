<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中文简历排版器 · 一页 A4</title>
<style>
/* ===== 简历本体（右栏渲染出来的东西） ===== */
@page { size: A4; margin: 10mm 11mm 10mm; }
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font: 9.8pt/1.45 "Helvetica Neue", Helvetica, "PingFang SC", sans-serif;
  color:#000; background:#fff; max-width:188mm; margin:0 auto;
  -webkit-font-smoothing: antialiased;
}
a { color:#000; text-decoration:none; }
/* 正文里的内联链接：加下划线，让人看得出可点 */
a.ilink { border-bottom:0.5px solid #888; }
strong { font-weight:700; }
em { font-style:italic; }

/* 抬头：大号无衬线姓名，仿 LaTeX 的 \MyName（Helvetica） */
header { margin-bottom:7px; display:flex; align-items:flex-start; gap:14px; }
.hd-l { flex:1 1 auto; min-width:0; }
/* 证件照：无边框、无圆角、无滤镜，保持原色 */
.photo { flex:0 0 auto; width:18.9mm; height:26.2mm; display:block; align-self:flex-end;
         object-fit:cover; object-position:center bottom; }  /* 裁掉照片顶部 32 行纯白 */
h1 { font:600 23pt/1.1 "Helvetica Neue", Helvetica, "PingFang SC", sans-serif;
     letter-spacing:2px; display:inline-block; }
.title { font:500 11.5pt/1 "Helvetica Neue", "PingFang SC", sans-serif; margin-left:14px; color:#333; }
/* 六列网格：标签 | 冒号 | 值，两组。
   标签用两端对齐（text-align-last:justify）撑满固定宽度，
   于是左边缘和冒号同时对齐——中文简历里「电 话 / 个人主页」那种排法。 */
.contact { margin-top:11px; font-size:9.3pt;
           display:grid; grid-template-columns:auto auto 1fr auto auto 1fr;
           row-gap:7px; column-gap:0; align-items:baseline; }
.contact .lb, .contact .lb2 { font-weight:700; display:inline-block;
           text-align:justify; text-align-last:justify; }
.contact .lb  { width:4.6em; }      /* 电话 / 个人主页 */
.contact .lb2 { width:3.32em; }   /* 刚好等于 GitHub 的自然宽度 */
.contact .lb2.en { text-align-last:left; }   /* 拉丁字母不做两端对齐，否则字距被撑开 */      /* 邮箱 / GitHub */
.contact .cl { font-weight:700; padding-right:2px; }
.contact .vl { padding-right:20px; }

/* 区块标题：仿 LaTeX titlesec 的粗体 + 下划线 */
h2 { font:700 11pt/1.25 "Helvetica Neue", "PingFang SC", sans-serif; letter-spacing:1px;
     margin:6px 0 2px; padding-bottom:1px; border-bottom:1px solid #000;
     break-after:avoid; }
h2 .sub { font:400 9.3pt "Helvetica Neue", "PingFang SC", sans-serif; color:#444; margin-left:6px; letter-spacing:0; }

/* 条目：仿 \datedsubsection —— 左标题 + 右对齐日期 */
.entry { display:flex; align-items:baseline; gap:10px; margin:3px 0 0; break-after:avoid; }
.entry .t { font-weight:700; font-size:10.4pt; }
.entry .t em { font-weight:700; }
.entry .d { margin-left:auto; flex:0 0 auto; font-size:9.2pt; white-space:nowrap;
            font-family:"Helvetica Neue", Helvetica, "PingFang SC", sans-serif; }
.entry .d a { text-decoration:none; border-bottom:1px solid #999; }

/* 仿 \Content 的 itemize */
ul { list-style:none; margin:2px 0 0; }
ul li { position:relative; padding-left:13px; margin-bottom:0; }
ul li::before { content:"•"; position:absolute; left:2px; }

/* 仿 \SimpleEntry 的整行说明 */
p.line { margin:2px 0; }
p.note { margin:3px 0 0; }
dl { display:grid; grid-template-columns:auto 1fr; gap:1px 8px; margin-top:3px; }
dt { font-weight:700; white-space:nowrap; }

@media print { body { padding:0; } }

/* 抬头下的一行亮点：居中加粗 */
p.line.highlight { text-align:center; font-weight:700; margin:6px 0 2px;
                   letter-spacing:.3px; }

/* 长网址允许断行，否则整串换行会在上一行末尾留大片空白 */
p.line, p.note { overflow-wrap:anywhere; }

/* ===== 自适应比例 =====
   --ks 等比缩放三级间距，--kf 等比缩放全部字号。
   基准值就是「排版标准.md」里的标准态：行间隙 5.9 : 条目 11 : 大块 17。
   两个变量由 head 里的 autofit 脚本二分求解，内容增删后自动把版面填回一页。 */
:root { --ks:1; --kf:1; }

body                 { font-size: calc(9.8pt  * var(--kf)); }
h1                   { font-size: calc(23pt   * var(--kf)); }
.title               { font-size: calc(11.5pt * var(--kf)); }
h2                   { font-size: calc(11pt   * var(--kf)); }
.entry .t            { font-size: calc(10.4pt * var(--kf)); }
.entry .d            { font-size: calc(9.2pt  * var(--kf)); }
.contact             { font-size: calc(9.3pt  * var(--kf)); }
h2 .sub, .entry .sub { font-size: calc(9.3pt  * var(--kf)); }

/* 三级间距：大块 / 中块 / 小块共用一个 --ks，层级比例恒定不走样 */
h2      { margin: calc(17px  * var(--ks)) 0 calc(4px * var(--ks)); }
.entry  { margin: calc(11px  * var(--ks)) 0 0; }
ul      { margin: calc(2px   * var(--ks)) 0 0; }
ul li   { margin-bottom: calc(1.5px * var(--ks)); }
p.note  { margin: calc(5px   * var(--ks)) 0 0; }
header  { margin-bottom: calc(7px * var(--ks)); }

/* 约束：正文里的链接一律右对齐，停在本条末行右端，不另起一行 */
li a.ilink, p.note a.ilink { float:right; margin-left:10px; }
li .rt2 { float:right; margin-left:12px; white-space:nowrap; }
li .rt2 a.ilink { float:none; margin-left:0; }


/* ===== 编辑器外壳，打印时全部隐藏 ===== */
html { background:#e9e7e3; }
body.app {
  max-width:none; margin:0; padding:0; background:#e9e7e3;
  font:13px/1.5 "Helvetica Neue", Helvetica, "PingFang SC", sans-serif; color:#2b2b2b;
}
.bar {
  position:fixed; top:0; left:0; right:0; height:48px; z-index:99;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:0 16px; background:rgba(252,252,251,.95);
  backdrop-filter:saturate(180%) blur(12px); border-bottom:1px solid #dcd9d4;
}
.bar .grp { display:flex; align-items:center; gap:8px; }
.bar label { user-select:none; cursor:pointer; }
.bar input[type=range] { width:170px; accent-color:#333; cursor:pointer; }
.bar input[type=range]:disabled { cursor:not-allowed; opacity:.4; }
.bar .val { font:12px ui-monospace,SFMono-Regular,Menlo,monospace; color:#666; min-width:42px; }
.bar .sp { flex:1 1 auto; }
button {
  font:13px/1 inherit; padding:6px 12px; border:1px solid #cfccc6; border-radius:7px;
  background:#fff; color:#333; cursor:pointer;
}
button:hover { border-color:#999; }
.pages { font-weight:600; padding:3px 10px; border-radius:20px; background:#e7f0e8; color:#2c6b34; }
.pages.over { background:#fbe6e3; color:#b03225; }

.wrap { display:flex; align-items:flex-start; gap:0; padding-top:48px; }
#editor {
  width:400px; flex:0 0 400px; height:calc(100vh - 48px); overflow-y:auto;
  padding:16px 16px 80px; background:#f6f5f3; border-right:1px solid #dcd9d4;
}
.preview { flex:1 1 auto; height:calc(100vh - 48px); overflow-y:auto; padding:26px 0 60px; }

/* 左栏控件 */
.card { background:#fff; border:1px solid #e2dfda; border-radius:10px; padding:12px; margin-bottom:12px; }
.card > h3 {
  font-size:12px; font-weight:700; color:#8a857e; letter-spacing:.6px;
  margin:0 0 10px; display:flex; align-items:center; gap:8px;
}
.card > h3 .sp { flex:1 1 auto; }
.row { display:flex; gap:6px; margin-bottom:6px; align-items:flex-start; }
.row:last-child { margin-bottom:0; }
input.f, textarea.f {
  width:100%; font:13px/1.5 inherit; color:#2b2b2b;
  padding:6px 8px; border:1px solid #ddd9d3; border-radius:6px; background:#fff;
}
input.f:focus, textarea.f:focus { outline:none; border-color:#8aa9d6; box-shadow:0 0 0 2px rgba(138,169,214,.2); }
textarea.f { resize:vertical; min-height:62px; }
.mini { flex:0 0 auto; padding:5px 8px; font-size:12px; border-radius:6px; }
.mini.x { color:#b03225; border-color:#e6d3d0; }
.lbl { font-size:11.5px; color:#8a857e; margin:8px 0 4px; }
.lbl:first-child { margin-top:0; }
.sec { border:1px solid #e2dfda; border-radius:10px; padding:12px; margin-bottom:12px; background:#fff; }
.sec > .hd { display:flex; gap:6px; align-items:center; margin-bottom:10px; }
.ent { border:1px dashed #ddd9d3; border-radius:8px; padding:10px; margin-bottom:8px; background:#fbfaf9; }
.hint { font-size:11.5px; color:#a09a92; margin-top:6px; }
.add { width:100%; margin-top:6px; border-style:dashed; color:#666; }

/* 右栏纸面：简历本体的字体在这里生效（body 已经被编辑器外壳占用） */
.sheet {
  font: calc(9.8pt * var(--kf))/1.45 "Helvetica Neue", Helvetica, "PingFang SC", sans-serif;
  color:#000; -webkit-font-smoothing:antialiased;
}
.sheet {
  width:210mm; min-height:297mm; margin:0 auto; background:#fff;
  padding:10mm 11mm; box-sizing:border-box; box-shadow:0 2px 18px rgba(0,0,0,.13);
  background-image:repeating-linear-gradient(to bottom,
     transparent 0, transparent calc(297mm - 1px),
     #e04b3a calc(297mm - 1px), #e04b3a 297mm);
}

@media print {
  html, body.app { background:#fff; }
  .bar, #editor, .hint { display:none !important; }
  .wrap { display:block; padding:0; }
  .preview { height:auto; overflow:visible; padding:0; }
  .sheet { width:auto; min-height:0; margin:0; padding:0; box-shadow:none; background-image:none; }
}
@media (max-width:1100px) {
  .wrap { flex-direction:column; }
  #editor { width:100%; flex:none; height:auto; border-right:0; border-bottom:1px solid #dcd9d4; }
  .preview { height:auto; width:100%; overflow-x:auto; }
}
</style>
</head>
<body class="app">

<div class="bar">
  <div class="grp"><label><input type="checkbox" id="lock" checked> 锁定一页</label></div>
  <div class="grp">
    <span>缩放</span>
    <input type="range" id="scale" min="70" max="140" step="1" value="100" disabled>
    <span class="val" id="scaleVal">100%</span>
  </div>
  <div class="grp"><span class="pages" id="pages">1 页</span></div>
  <div class="sp"></div>
  <div class="grp">
    <button id="print">导出 PDF</button>
    <button id="save">下载 HTML</button>
    <button id="reset">重置模板</button>
  </div>
</div>

<div class="wrap">
  <div id="editor"></div>
  <div class="preview"><div class="sheet" id="sheet"></div></div>
</div>

<script type="application/json" id="data">null</script>
<script>
(function(){
  var AVAIL = (297-20)*96/25.4, SAFE = 4;
  var KS = [0.42, 2.20], KF = [0.86, 1.08];
  var R = document.documentElement, KEY = 'resume-zh-data';
  var sheet = document.getElementById('sheet'), editor = document.getElementById('editor');
  var lock = document.getElementById('lock'), slider = document.getElementById('scale');
  var sval = document.getElementById('scaleVal'), pagesEl = document.getElementById('pages');
  var base = {ks:1, kf:1};

  var PHOTO = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 600"><rect width="410" height="600" fill="#eeebe6"/>'+
    '<circle cx="205" cy="238" r="86" fill="#d8d3cb"/><path d="M45 600 q30-170 160-170 t160 170 z" fill="#d8d3cb"/>'+
    '<text x="205" y="560" font-family="PingFang SC,sans-serif" font-size="34" fill="#a9a29a" text-anchor="middle">证件照</text></svg>');

  var DEFAULT = {
    name:'你的名字', title:'求职意向', photo:'',
    contacts:[
      {label:'电话', value:'13800138000'},
      {label:'邮箱', value:'you@example.com'},
      {label:'个人主页', value:'example.com'},
      {label:'GitHub', value:'github.com/you'}
    ],
    highlight:'一行亮点　·　放三到四个最硬的结果　·　数字要具体不要取整　·　没有就留空',
    sections:[
      { title:'项目 / 作品', entries:[
        { t:'项目名称 平台或角色', d:'example.com', bullets:[
          '这个项目解决什么问题，给谁用，做出来的结果是什么。先写背景和动机，再写做了什么',
          '技术选型与关键取舍：为什么这么做，代价是什么。专有名词原样写，不缩写不翻译'] },
        { t:'项目名称 平台或角色', d:'example.com', bullets:[
          '一条要点写一件事，数字具体到小数位，比如次留 1.91%、80 万条数据、1600 余支队伍'] }
      ]},
      { title:'工作经历', entries:[
        { t:'公司 职位', d:'2024.01 – 至今 · 城市', bullets:[
          '当时的处境是什么，为什么要做这件事',
          '你负责哪一段，跟谁配合，最后落到什么结果',
          '流程可以用连字符串成一串：需求分析-产品文档-设计-开发-埋点-测试-灰度-上线-数据'] },
        { t:'公司 职位', d:'2022.03 – 2023.12 · 城市', bullets:[
          '写你真正做过的事，不写岗位职责',
          '直说抄谁、对标谁，不包装：对标某某产品的某个功能'] }
      ]},
      { title:'技能', entries:[
        { t:'方向一', d:'熟练程度或年限', bullets:[
          '具体到工具和版本，专有名词原样写：TypeScript、Next.js 16、PostgreSQL'] },
        { t:'方向二', d:'熟练程度或年限', bullets:[
          '只写真会用的；写上去的每一样都可能被追问细节'] }
      ]},
      { title:'教育与其他', entries:[
        { t:'学校 专业 学历', d:'2018.09 – 2022.06', bullets:[
          '竞赛：比赛名称与名次，参赛规模写清楚',
          '兴趣与特长：能佐证性格或长期投入的事，带具体成绩'] }
      ]}
    ]
  };

  var data = load();
  function load(){
    try {
      var inline = JSON.parse(document.getElementById('data').textContent);
      if (inline && inline.sections) return inline;
    } catch(e){}
    try {
      var s = localStorage.getItem(KEY);
      if (s) { var d = JSON.parse(s); if (d && d.sections) return d; }
    } catch(e){}
    return JSON.parse(JSON.stringify(DEFAULT));
  }
  function persist(){ try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){} }

  // ——— 渲染右栏 ———
  var E = function(s){ return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
  var URLRE = /(?:^|\s)((?:https?:\/\/)?[a-z0-9-]+(?:\.[a-z0-9-]+)+(?:\/[^\s]*)?)\s*$/i;

  function linkify(text){                       // 行尾的网址拆出来，靠 CSS 浮到右端
    var m = String(text||'').match(URLRE);
    if (!m) return E(text);
    var url = m[1], head = text.slice(0, text.length - m[0].length);
    var href = /^https?:/i.test(url) ? url : 'https://' + url;
    return E(head) + '<a class="ilink" href="' + E(href) + '">' + E(url) + '</a>';
  }
  function isLatin(s){ return /^[\x20-\x7E]+$/.test(String(s||'').trim()); }

  function renderSheet(){
    var h = [];
    h.push('<header><div class="hd-l"><h1>'+E(data.name)+'</h1>'+
           (data.title ? '<span class="title">'+E(data.title)+'</span>' : ''));
    if (data.contacts.length){
      h.push('<div class="contact">');
      data.contacts.forEach(function(c, i){
        var cls = (i % 2 === 0 ? 'lb' : 'lb2') + (isLatin(c.label) ? ' en' : '');
        h.push('<span class="'+cls+'">'+E(c.label)+'</span><span class="cl">：</span>'+
               '<span class="vl">'+linkifyContact(c.value)+'</span>');
      });
      h.push('</div>');
    }
    h.push('</div><img class="photo" src="'+E(data.photo || PHOTO)+'" alt="证件照"></header>');
    if (data.highlight) h.push('<p class="line highlight">'+E(data.highlight)+'</p>');
    data.sections.forEach(function(s){
      h.push('<h2>'+E(s.title)+'</h2>');
      s.entries.forEach(function(en){
        h.push('<div class="entry"><span class="t">'+E(en.t)+'</span>'+
               (en.d ? '<span class="d">'+linkifyD(en.d)+'</span>' : '')+'</div>');
        var bs = (en.bullets||[]).filter(function(b){ return String(b).trim(); });
        if (bs.length) h.push('<ul>'+bs.map(function(b){ return '<li>'+linkify(b)+'</li>'; }).join('')+'</ul>');
      });
    });
    sheet.innerHTML = h.join('\n');
  }
  function linkifyContact(v){
    v = String(v||'');
    if (/^[\d +\-()]{6,}$/.test(v)) return '<a href="tel:'+E(v.replace(/[^\d+]/g,''))+'">'+E(v)+'</a>';
    if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) return '<a href="mailto:'+E(v)+'">'+E(v)+'</a>';
    if (/^(https?:\/\/)?[a-z0-9-]+(\.[a-z0-9-]+)+/i.test(v))
      return '<a href="'+E(/^https?:/i.test(v)?v:'https://'+v)+'">'+E(v)+'</a>';
    return E(v);
  }
  function linkifyD(d){
    if (/^(https?:\/\/)?[a-z0-9-]+(\.[a-z0-9-]+)+(\/\S*)?$/i.test(String(d).trim()))
      return '<a href="'+E(/^https?:/i.test(d)?d:'https://'+d)+'">'+E(d)+'</a>';
    return E(d);
  }

  // ——— 渲染左栏 ———
  function renderEditor(){
    var h = [];
    h.push('<div class="card"><h3>基本信息</h3>'+
      '<div class="lbl">姓名</div><input class="f" data-k="name" value="'+E(data.name)+'">'+
      '<div class="lbl">求职意向 / 头衔</div><input class="f" data-k="title" value="'+E(data.title)+'">'+
      '<div class="lbl">证件照</div><input type="file" accept="image/*" id="photoFile">'+
      (data.photo ? '<button class="mini x" data-act="rmphoto" style="margin-top:6px">移除照片</button>' : '')+
      '<div class="lbl">一行亮点</div><textarea class="f" data-k="highlight" style="min-height:48px">'+E(data.highlight)+'</textarea>'+
      '</div>');

    h.push('<div class="card"><h3>联系方式<span class="sp"></span></h3>');
    data.contacts.forEach(function(c,i){
      h.push('<div class="row">'+
        '<input class="f" style="flex:0 0 92px" data-c="'+i+'" data-f="label" value="'+E(c.label)+'">'+
        '<input class="f" data-c="'+i+'" data-f="value" value="'+E(c.value)+'">'+
        '<button class="mini x" data-act="delc" data-i="'+i+'">×</button></div>');
    });
    h.push('<button class="add" data-act="addc">+ 加一行联系方式</button>'+
           '<div class="hint">两列排布，第 1、3、5… 条在左列。标签是中文会自动两端对齐，纯英文不对齐。</div></div>');

    data.sections.forEach(function(s,si){
      h.push('<div class="sec"><div class="hd">'+
        '<input class="f" data-s="'+si+'" data-f="title" value="'+E(s.title)+'">'+
        '<button class="mini" data-act="sup" data-s="'+si+'" title="上移">↑</button>'+
        '<button class="mini" data-act="sdn" data-s="'+si+'" title="下移">↓</button>'+
        '<button class="mini x" data-act="dels" data-s="'+si+'">×</button></div>');
      s.entries.forEach(function(en,ei){
        h.push('<div class="ent">'+
          '<div class="row">'+
            '<input class="f" data-s="'+si+'" data-e="'+ei+'" data-f="t" placeholder="条目标题" value="'+E(en.t)+'">'+
            '<button class="mini" data-act="eup" data-s="'+si+'" data-e="'+ei+'" title="上移">↑</button>'+
            '<button class="mini" data-act="edn" data-s="'+si+'" data-e="'+ei+'" title="下移">↓</button>'+
            '<button class="mini x" data-act="dele" data-s="'+si+'" data-e="'+ei+'">×</button>'+
          '</div>'+
          '<input class="f" data-s="'+si+'" data-e="'+ei+'" data-f="d" placeholder="右侧：时间 · 地点，或一个网址" value="'+E(en.d)+'">'+
          '<textarea class="f" data-s="'+si+'" data-e="'+ei+'" data-f="bullets" placeholder="一行一条要点">'+E((en.bullets||[]).join('\n'))+'</textarea>'+
        '</div>');
      });
      h.push('<button class="add" data-act="adde" data-s="'+si+'">+ 加一条经历</button></div>');
    });

    h.push('<button class="add" data-act="adds" style="margin-bottom:10px">+ 加一个区块</button>'+
           '<div class="hint">要点里行尾写网址会自动做成右对齐的可点链接。</div>');
    editor.innerHTML = h.join('');
  }

  // ——— 自适应与页数 ———
  function bottom(){
    var e = sheet.getElementsByTagName('*'), m = 0, top = sheet.getBoundingClientRect().top;
    for (var i=0;i<e.length;i++){
      var b = e[i].getBoundingClientRect().bottom - top; if (b>m) m = b;
    }
    return m + 10*96/25.4;                       // 加回上边距
  }
  function set(ks, kf){ R.style.setProperty('--ks', ks); R.style.setProperty('--kf', kf); }
  function slackAt(ks, kf){ set(ks, kf); return AVAIL - (bottom() - 10*96/25.4); }
  function bestKs(kf, floor){
    var lo = floor==null ? 0.80 : floor, hi = KS[1];
    if (slackAt(lo,kf) < SAFE) return null;
    if (slackAt(hi,kf) >= SAFE) return hi;
    for (var i=0;i<16;i++){ var mid=(lo+hi)/2; if (slackAt(mid,kf)>=SAFE) lo=mid; else hi=mid; }
    return lo;
  }
  function fit(){
    var kf = 1, ks = bestKs(1), f;
    if (ks === null){
      for (f=0.99; f>=KF[0]-1e-9; f-=0.01){
        f=+f.toFixed(2); ks=bestKs(f); if (ks!==null){ kf=f; break; }
      }
      if (ks === null){ kf=KF[0]; ks=bestKs(kf, KS[0]); }
      if (ks === null) ks = KS[0];
    } else if (ks >= KS[1]-1e-6 && slackAt(KS[1],1) > 30){
      for (f=1.01; f<=KF[1]+1e-9; f+=0.01){
        f=+f.toFixed(2); var t=bestKs(f); if (t===null) break;
        kf=f; ks=t; if (slackAt(ks,kf)<=30) break;
      }
    }
    set(ks, kf); return {ks:ks, kf:kf};
  }
  function pageCount(){ return Math.max(1, Math.ceil((bottom() - 10*96/25.4 - SAFE) / AVAIL)); }
  function paint(atFloor){
    var n = pageCount();
    pagesEl.textContent = n + ' 页' + (n>1 && atFloor ? ' · 已压到最小，请删减' : '');
    pagesEl.className = 'pages' + (n>1 ? ' over' : '');
    sheet.style.minHeight = (n*297) + 'mm';
  }
  function applyManual(){
    var k = slider.value/100; sval.textContent = slider.value + '%';
    set(+(base.ks*k).toFixed(4), +(base.kf*k).toFixed(4)); paint();
  }
  function applyLocked(){
    var r = fit(); base = r;
    slider.value = 100; sval.textContent = '100%';
    paint(r.kf <= KF[0] + 1e-9);
  }
  function refit(){ lock.checked ? applyLocked() : paint(); }

  var t1;
  function update(reEditor){
    renderSheet();
    if (reEditor) renderEditor();
    refit(); persist();
  }

  // ——— 左栏交互 ———
  editor.addEventListener('input', function(e){
    var el = e.target; if (!el.classList.contains('f')) return;
    var k = el.getAttribute('data-k');
    if (k){ data[k] = el.value; }
    else if (el.hasAttribute('data-c')){
      data.contacts[+el.getAttribute('data-c')][el.getAttribute('data-f')] = el.value;
    } else if (el.hasAttribute('data-e')){
      var en = data.sections[+el.getAttribute('data-s')].entries[+el.getAttribute('data-e')];
      var f = el.getAttribute('data-f');
      if (f === 'bullets') en.bullets = el.value.split('\n');
      else en[f] = el.value;
    } else if (el.hasAttribute('data-s')){
      data.sections[+el.getAttribute('data-s')].title = el.value;
    }
    clearTimeout(t1); t1 = setTimeout(function(){ update(false); }, 260);
  });

  editor.addEventListener('click', function(e){
    var b = e.target.closest('button[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act');
    var si = +b.getAttribute('data-s'), ei = +b.getAttribute('data-e'), i = +b.getAttribute('data-i');
    var S = data.sections;
    if (act === 'addc') data.contacts.push({label:'标签', value:'内容'});
    if (act === 'delc') data.contacts.splice(i,1);
    if (act === 'rmphoto') data.photo = '';
    if (act === 'adds') S.push({title:'新区块', entries:[{t:'条目标题', d:'时间 · 地点', bullets:['写一条要点']}]});
    if (act === 'dels') S.splice(si,1);
    if (act === 'sup' && si>0) S.splice(si-1,0,S.splice(si,1)[0]);
    if (act === 'sdn' && si<S.length-1) S.splice(si+1,0,S.splice(si,1)[0]);
    if (act === 'adde') S[si].entries.push({t:'条目标题', d:'时间 · 地点', bullets:['写一条要点']});
    if (act === 'dele') S[si].entries.splice(ei,1);
    if (act === 'eup' && ei>0){ var E1=S[si].entries; E1.splice(ei-1,0,E1.splice(ei,1)[0]); }
    if (act === 'edn'){ var E2=S[si].entries; if (ei<E2.length-1) E2.splice(ei+1,0,E2.splice(ei,1)[0]); }
    update(true);
  });

  editor.addEventListener('change', function(e){
    if (e.target.id !== 'photoFile' || !e.target.files[0]) return;
    var fr = new FileReader();
    fr.onload = function(){ data.photo = fr.result; update(true); };
    fr.readAsDataURL(e.target.files[0]);
  });

  // ——— 工具条 ———
  lock.addEventListener('change', function(){
    slider.disabled = lock.checked;
    if (lock.checked) applyLocked();
    else {
      var cs = getComputedStyle(R);
      base = { ks:parseFloat(cs.getPropertyValue('--ks'))||1, kf:parseFloat(cs.getPropertyValue('--kf'))||1 };
      slider.value = 100; applyManual();
    }
  });
  slider.addEventListener('input', applyManual);
  document.getElementById('print').addEventListener('click', function(){
    if (lock.checked) applyLocked();
    window.print();
  });
  document.getElementById('save').addEventListener('click', function(){
    document.getElementById('data').textContent = JSON.stringify(data);
    var doc = '<!doctype html>\n' + document.documentElement.outerHTML;
    document.getElementById('data').textContent = 'null';
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([doc], {type:'text/html;charset=utf-8'}));
    a.download = (data.name || '简历') + '.html'; a.click();
  });
  document.getElementById('reset').addEventListener('click', function(){
    if (!confirm('丢掉当前内容，恢复成空白模板？')) return;
    data = JSON.parse(JSON.stringify(DEFAULT)); update(true);
  });

  window.addEventListener('load', refit);
  update(true);
})();
</script>
</body>
</html>
